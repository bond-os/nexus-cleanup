# nexus-cleanup — Forgejo Actions workflow.
#
# Copy to .forgejo/workflows/nexus-cleanup.yml.
#
# Needs:
#   - a runner with the `docker` label
#   - repository variable NEXUS_URL, secrets NEXUS_USERNAME and NEXUS_PASSWORD
#
# Every run performs a dry run and uploads its report. Deletion happens only in a run
# started by hand with `execute` ticked, and a scheduled run never deletes. Forgejo
# has no approval gate inside a run, so read a dry-run report before ticking
# `execute`: the deletion cap is what stands between a surprise and the repository.
#
# The job image is a node image rather than the Nushell one: Forgejo runs JavaScript
# actions (checkout, upload-artifact) inside the job container, and the Nushell
# image has no node. Nushell is installed at the pinned version instead, verified by
# checksum. The binary is x86_64; on an arm64 runner use the aarch64-unknown-linux-musl
# asset and its checksum.

name: nexus-cleanup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      pattern:
        description: Glob selecting the proxy repositories to clean
        type: string
        default: 'yum-proxy-*'
      keep:
        description: Newest versions to retain per group
        type: number
        default: 2
      max_deletions:
        description: Abort an executing run above this many deletions
        type: number
        default: 500
      execute:
        description: Delete after the dry run
        type: boolean
        default: false

concurrency:
  group: nexus-cleanup

jobs:
  cleanup:
    runs-on: docker
    container:
      image: node:24-bookworm
    env:
      NEXUS_URL: ${{ vars.NEXUS_URL }}
      # Scheduled runs have no inputs, so each falls back to the dispatch default.
      PATTERN: ${{ inputs.pattern || 'yum-proxy-*' }}
      KEEP: ${{ inputs.keep || 2 }}
      MAX_DELETIONS: ${{ inputs.max_deletions }}
      # Pinned to the version floor in AGENTS.md.
      NU_VERSION: 0.115.1
      NU_SHA256: 8a9722177ddd421eba927b4baae4ae341a4d1c3434504be7b1b17d998bafdd87
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install Nushell
        run: |
          asset="nu-${NU_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o /tmp/nu.tar.gz \
            "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${asset}.tar.gz"
          echo "${NU_SHA256}  /tmp/nu.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nu.tar.gz -C /usr/local/bin --strip-components=1 "${asset}/nu"
          nu --version

      - name: Dry run
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          nu nexus-cleanup.nu --pattern "$PATTERN" --keep "$KEEP" \
            --summary-out summary-dry-run.json > report-dry-run.json

      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        if: always()
        with:
          name: dry-run
          path: |
            report-dry-run.json
            summary-dry-run.json

      - name: Execute
        # A boolean input can arrive as a string, depending on the Forgejo version.
        if: github.event_name == 'workflow_dispatch' && (inputs.execute == true || inputs.execute == 'true')
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          case "$MAX_DELETIONS" in
            ''|*[!0-9]*|0*) echo "execute needs max_deletions set to a positive whole number" >&2; exit 2 ;;
          esac
          nu nexus-cleanup.nu --pattern "$PATTERN" --keep "$KEEP" \
            --max-deletions "$MAX_DELETIONS" --execute \
            --summary-out summary-execute.json > report-execute.json

      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        if: always() && hashFiles('report-execute.json') != ''
        with:
          name: execute
          path: |
            report-execute.json
            summary-execute.json
