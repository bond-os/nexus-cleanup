name: repair Nushell checksum

# A failed checksum is expected on every Renovate Nushell version update. The
# workflow definition runs from the default branch and treats the PR checkout as
# data; it may amend only the established Renovate branch.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions: {}

concurrency:
  group: repair-nushell-checksum
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
    steps:
      - name: Check out trusted maintenance code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          path: trusted
          persist-credentials: false

      - name: Validate the failed run and pull request
        id: validate
        working-directory: trusted
        run: |
          refuse() {
            echo "$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$RUN_HEAD_REPOSITORY" != "$REPOSITORY" ]; then
            refuse "Refusing repair: the workflow run came from a fork."
          fi
          if [ "$RUN_HEAD_BRANCH" != "renovate/nushell" ]; then
            refuse "Refusing repair: branch '$RUN_HEAD_BRANCH' is not renovate/nushell."
          fi

          checksum_jobs=$(
            gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs" --paginate \
              --jq '[.jobs[] | select(.name == "nushell-checksum") | .conclusion] | @json'
          )
          if [ "$checksum_jobs" != '["failure"]' ]; then
            refuse "Refusing repair: nushell-checksum did not fail exactly once."
          fi

          # The dollar signs in the jq filter name jq arguments, not shell variables.
          # shellcheck disable=SC2016
          pulls=$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$REPOSITORY/commits/$RUN_HEAD_SHA/pulls" |
              jq --arg sha "$RUN_HEAD_SHA" --arg repo "$REPOSITORY" \
                --arg base "$DEFAULT_BRANCH" '[
                .[] |
                select(
                  .state == "open" and
                  .user.login == "renovate[bot]" and
                  .head.ref == "renovate/nushell" and
                  .head.sha == $sha and
                  .head.repo.full_name == $repo and
                  .base.ref == $base
                )
              ]'
          )
          if [ "$(printf '%s' "$pulls" | jq 'length')" -ne 1 ]; then
            refuse "Refusing repair: expected one eligible open Renovate pull request."
          fi
          pr_number=$(printf '%s' "$pulls" | jq -r '.[0].number')

          # The commit-associated pull request response is simplified and does not
          # include the commit count. Recheck eligibility against the full PR
          # representation so the one-commit invariant is actually enforced.
          pr=$(gh api "repos/$REPOSITORY/pulls/$pr_number")
          if ! printf '%s' "$pr" | jq -e \
            --arg sha "$RUN_HEAD_SHA" \
            --arg repo "$REPOSITORY" \
            --arg base "$DEFAULT_BRANCH" '
              .state == "open" and
              .user.login == "renovate[bot]" and
              .head.ref == "renovate/nushell" and
              .head.sha == $sha and
              .head.repo.full_name == $repo and
              .base.ref == $base and
              .commits == 1
            ' >/dev/null; then
            refuse "Refusing repair: pull request #$pr_number is no longer eligible."
          fi

          files=$(
            gh api "repos/$REPOSITORY/pulls/$pr_number/files" --paginate \
              --jq '[.[] | .filename]'
          )
          if ! printf '%s' "$files" | jq -e '
            length > 0 and
            (all(.[]; IN(
              "Containerfile",
              ".github/workflows/tests.yml",
              "README.md",
              "AGENTS.md",
              "nexus-cleanup/templates/ci/forgejo/.forgejo/workflows/nexus-cleanup.yml",
              "examples/forgejo/.forgejo/workflows/nexus-cleanup.yml"
            ))) and
            any(.[]; . == "nexus-cleanup/templates/ci/forgejo/.forgejo/workflows/nexus-cleanup.yml") and
            any(.[]; . == "examples/forgejo/.forgejo/workflows/nexus-cleanup.yml")
          ' >/dev/null; then
            refuse "Refusing repair: pull request contains files outside the Nushell pin allowlist."
          fi

          echo "Eligible pull request: #$pr_number at $RUN_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Check out the verified pull request revision
        if: steps.validate.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RUN_HEAD_SHA }}
          path: pull-request
          fetch-depth: 0
          persist-credentials: true

      - name: Repair, amend and rerun tests
        if: steps.validate.outputs.eligible == 'true'
        working-directory: pull-request
        env:
          PR_NUMBER: ${{ steps.validate.outputs.pr_number }}
        run: |
          if ! original_parent=$(git rev-parse "$RUN_HEAD_SHA^"); then
            echo "Refusing to amend: the verified pull request commit has no parent." >&2
            exit 1
          fi

          ../trusted/.github/scripts/repair-nushell-checksum.sh

          changed=$(
            git status --short |
              sed -nE 's/^ M (.*)$/\1/p' |
              sort
          )
          expected=$(
            printf '%s\n' \
              'examples/forgejo/.forgejo/workflows/nexus-cleanup.yml' \
              'nexus-cleanup/templates/ci/forgejo/.forgejo/workflows/nexus-cleanup.yml' |
              sort
          )
          if [ -z "$changed" ]; then
            echo "The failed check is no longer explained by stale checksum files; no commit was made." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$changed" != "$expected" ]; then
            echo "Refusing to amend: unexpected changed files." >&2
            git status --short >&2
            exit 1
          fi

          git diff --check
          git add \
            examples/forgejo/.forgejo/workflows/nexus-cleanup.yml \
            nexus-cleanup/templates/ci/forgejo/.forgejo/workflows/nexus-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --amend --no-edit
          if [ "$(git rev-parse HEAD^)" != "$original_parent" ]; then
            echo "Refusing to push: the amended commit did not retain its parent." >&2
            exit 1
          fi
          git push \
            --force-with-lease="refs/heads/renovate/nushell:$RUN_HEAD_SHA" \
            origin HEAD:refs/heads/renovate/nushell
          gh api \
            --method POST \
            "repos/$REPOSITORY/actions/workflows/tests.yml/dispatches" \
            -f ref=renovate/nushell
          echo "Amended pull request #$PR_NUMBER and dispatched a fresh tests run." \
            >> "$GITHUB_STEP_SUMMARY"
