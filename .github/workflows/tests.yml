name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow re-runs both jobs on the release commit before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow names the caller when this runs via workflow_call, so the
  # release run's tests never share a group with (or cancel) the push run's.
  group: ${{ github.workflow }}-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # Pinned to match the version floor in AGENTS.md. Nushell breaks
      # compatibility between minor releases, so this moves deliberately.
      image: ghcr.io/nushell/nushell:0.115.1-alpine
      # The image runs as `nushell` (uid 1000), but the runner hands the job a
      # workspace owned by its own uid, so checkout fails without root.
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Importing the module is inert
        run: |
          out=$(nu -c 'use nexus-cleanup' 2>&1)
          if [ -n "$out" ]; then
            echo "importing the module printed output:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: Run the test suite
        run: nu tests/run-tests.nu

  # Builds the image exactly as a release would and smoke-checks it. Pushes nothing.
  image:
    # Pinned rather than ubuntu-latest: the rootless Podman pass relies on the
    # runner image shipping Podman.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version
        id: version
        run: |
          version=$(sed -nE 's/^export const VERSION = "([^"]+)".*/\1/p' nexus-cleanup/version.nu)
          if [ -z "$version" ]; then
            echo "could not read VERSION from nexus-cleanup/version.nu" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # No QEMU setup: the Containerfile has no RUN step, so every platform
      # builds without emulation. Adding one would need it.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build every platform
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: false

      - name: Build the runner's platform for the smoke check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.version }}
          load: true
          tags: nexus-cleanup:smoke

      - name: Smoke-check the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/image-smoke.sh nexus-cleanup:smoke "$VERSION"

      # The same image again, run the way a rootless CI runner runs it: the user
      # namespace maps the caller to container root, which is where workspace
      # ownership goes wrong.
      - name: Smoke-check the image under rootless Podman
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CONTAINER_ENGINE: podman
        run: |
          if [ "$(podman info --format '{{.Host.Security.Rootless}}')" != "true" ]; then
            echo "podman is not running rootless; this check would prove nothing" >&2
            exit 1
          fi
          ref=$(docker save nexus-cleanup:smoke | podman load | sed -n 's/^Loaded image: //p')
          if [ -z "$ref" ]; then
            echo "podman load reported no image" >&2
            exit 1
          fi
          .github/scripts/image-smoke.sh "$ref" "$VERSION"
