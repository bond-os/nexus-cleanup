name: release

# Every push to main updates the release PR. Merging that PR makes release-please
# tag vX.Y.Z and publish the GitHub Release in this same run, and only then is an
# image built and pushed. A pushed tag alone never publishes anything.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The App's key is an environment secret: only jobs running on main that
    # declare this environment can read it. See AGENTS.md, "The release App".
    environment: release
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # An App token, not GITHUB_TOKEN: pull requests opened with GITHUB_TOKEN
      # trigger no workflows, so the release PR would never get its required
      # checks. The token is scoped to this repository and asks for exactly what
      # release-please needs, whatever the App itself may hold.
      - name: Mint a release token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  tests:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  publish:
    needs: [release-please, tests]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/nexus-cleanup
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      # The image label, the tool's --version and the git tag must all agree.
      - name: Check the version source against the release
        run: |
          file_version=$(sed -nE 's/^export const VERSION = "([^"]+)".*/\1/p' nexus-cleanup/version.nu)
          if [ "$file_version" != "$RELEASE_VERSION" ]; then
            echo "version.nu says '$file_version' but release-please released '$RELEASE_VERSION'" >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "checked out $(git rev-parse HEAD), expected the release commit $RELEASE_SHA" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the runner's platform for the smoke check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          build-args: VERSION=${{ env.RELEASE_VERSION }}
          load: true
          tags: nexus-cleanup:smoke

      - name: Smoke-check the image
        run: .github/scripts/image-smoke.sh nexus-cleanup:smoke "$RELEASE_VERSION"

      # X.Y.Z and X.Y only. latest=false matters: metadata-action otherwise adds
      # `latest` to semver tags, and a floating tag is what this project refuses.
      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push every platform
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: VERSION=${{ env.RELEASE_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
